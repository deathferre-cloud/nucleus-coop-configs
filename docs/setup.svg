<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 330" role="img" aria-labelledby="schemeTitle schemeDesc"><title id="schemeTitle">Два независимых комплекта для игроков</title><desc id="schemeDesc">Первый геймпад управляет основным экраном со своими наушниками. Второй геймпад управляет правым экраном со второй парой наушников. Оба игрока подключены к одному миру.</desc><defs><linearGradient id="screen" x2="0" y2="1"><stop stop-color="#324c37"/><stop offset="1" stop-color="#17291e"/></linearGradient><symbol id="pad" viewBox="0 0 100 55"><path d="M25 5H75Q87 5 93 24L98 42Q98 52 87 49L72 36H28L13 49Q2 52 2 42L7 24Q13 5 25 5Z" fill="#23382b" stroke="currentColor" stroke-width="3"/><path d="M22 16V32M14 24H30" stroke="currentColor" stroke-width="4"/><circle cx="73" cy="19" r="3" fill="currentColor"/><circle cx="82" cy="27" r="3" fill="currentColor"/></symbol><symbol id="phones" viewBox="0 0 50 50"><path d="M8 28V22a17 17 0 0 1 34 0v6" fill="none" stroke="currentColor" stroke-width="4"/><rect x="5" y="24" width="9" height="17" rx="4" fill="currentColor"/><rect x="36" y="24" width="9" height="17" rx="4" fill="currentColor"/></symbol></defs>
